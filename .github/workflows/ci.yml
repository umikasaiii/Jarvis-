name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

# No heavy model downloads happen in CI (docs/MODELS.md); models are never in the repo.
jobs:
  core:
    name: Domain core (JVM) — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test :core
        working-directory: core
        run: ./gradlew test --no-daemon --stacktrace

  android:
    name: Android app — assemble, unit test, lint
    runs-on: ubuntu-latest
    # The Android job needs the Android SDK and access to dl.google.com. On
    # networks that block that host, this job cannot resolve AGP/AndroidX
    # (see docs/DECISIONS/0003). GitHub-hosted runners have both.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
