name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# No AI models are ever downloaded in CI (docs/MODELS.md); models are never in the repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests + Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needed to publish the debug APK as a GitHub Release (mobile-friendly,
    # no-login download link).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ---- Domain core (pure Kotlin/JVM). Runs as a standalone build via -p. ----
      - name: Core unit tests
        run: ./gradlew --no-daemon -p core test

      # ---- Android app. assembleDebug also builds the composite :core. ----
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # § MICRO-PATCH E.1 §9/§14 — compiles (never runs; no emulator here)
      # the instrumented test APK, so a new androidTest file (e.g. the Room
      # migration/schema-validation regression test) is at least confirmed
      # to compile against the real Room-generated code on every push,
      # instead of silently never being checked by CI.
      - name: Compile instrumented tests (no emulator, compile-only)
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Android lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Compute APK SHA-256
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          sha256sum "$APK" | tee "$APK.sha256"
          ls -l "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      # Publish the APK to a single, stable 'latest-debug' release so it can be
      # downloaded directly on a phone with no login:
      #   https://github.com/<owner>/<repo>/releases/download/latest-debug/app-debug.apk
      - name: Publish APK to the 'latest-debug' release
        # Manual dispatches publish too: when the push event does not create a
        # run (GitHub Actions queue incidents), the dispatch is the only way to
        # get an installable APK, and a green build that publishes nothing is
        # indistinguishable from no build at all for whoever is testing.
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug "$APK" "$APK.sha256" \
            --title "JARVIS Mobile — debug (latest)" \
            --notes "APK di debug piu recente. Commit ${{ github.sha }}. Firmato con app/debug.keystore (committato, stabile): si aggiorna in place, non serve disinstallare." \
            --target "${{ github.sha }}"

      # Reports are uploaded even when a previous step failed, to diagnose errors.
      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/**
            core/build/test-results/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14

  # PASS 14B pre-execution compatibility gate. run_real_training.ps1 is the
  # sole Windows runner for the (still user-PC-only) real EmbeddingGemma
  # qualification/training pipeline; it previously corrupted the parser on
  # the target Windows PowerShell 5.1 environment because it was UTF-8
  # without BOM with non-ASCII punctuation, requiring a manual BOM-converted
  # temporary copy to run at all. That file is now kept pure ASCII, and this
  # job proves it stays that way and stays parseable under REAL Windows
  # PowerShell 5.1 (not pwsh 7) on every push - without downloading any
  # model/tokenizer artifact or installing any Python dependency.
  windows-ps51-compat:
    name: PASS 14B Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert running under Windows PowerShell 5.1 (not pwsh 7)
        run: |
          $ver = $PSVersionTable.PSVersion
          $edition = $PSVersionTable.PSEdition
          Write-Host "PSVersion: $ver"
          Write-Host "PSEdition: $edition"
          if ($edition -ne "Desktop") {
            Write-Host "FAILED: expected PSEdition 'Desktop' (Windows PowerShell), got '$edition' - this gate must run under Windows PowerShell 5.1, not PowerShell 7/pwsh." -ForegroundColor Red
            exit 1
          }
          if ($ver.Major -ne 5) {
            Write-Host "FAILED: expected Windows PowerShell major version 5, got $($ver.Major)." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: running under Windows PowerShell $ver (PSEdition=$edition)"

      - name: ASCII-safety check on run_real_training.ps1
        run: |
          $path = "tools\semantic_classifier\run_real_training.ps1"
          if (-not (Test-Path $path)) {
            Write-Host "FAILED: $path not found." -ForegroundColor Red
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $nonAsciiCount = 0
          foreach ($b in $bytes) { if ($b -gt 127) { $nonAsciiCount++ } }
          Write-Host "File size: $($bytes.Length) bytes"
          Write-Host "Non-ASCII byte count: $nonAsciiCount"
          if ($nonAsciiCount -gt 0) {
            Write-Host "FAILED: non-ASCII bytes found in $path - this file must stay ASCII-safe so it parses on Windows PowerShell 5.1 without a manual BOM conversion." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: $path is pure ASCII"

      - name: Parse run_real_training.ps1 with the PowerShell language parser
        run: |
          $path = (Resolve-Path "tools\semantic_classifier\run_real_training.ps1").Path
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          Write-Host "Token count: $($tokens.Count)"
          Write-Host "Parser error count: $($parseErrors.Count)"
          if ($parseErrors.Count -gt 0) {
            foreach ($e in $parseErrors) {
              Write-Host "PARSE ERROR: $($e.Message) at line $($e.Extent.StartLineNumber), column $($e.Extent.StartColumnNumber)" -ForegroundColor Red
            }
            exit 1
          }
          Write-Host "OK: zero parser errors"
