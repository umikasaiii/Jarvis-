name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# No AI models are ever downloaded in CI (docs/MODELS.md); models are never in the repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The ONLY ref allowed to (re)publish the shared 'latest-debug' release. Any other branch,
# pull request or manual run from another branch builds and tests but can never publish.
# Enforced structurally (separate 'publish' job; the build job's token is read-only) and
# checked by .github/scripts/test-ci-publish-guard.sh on every run.
env:
  PUBLISH_REF: refs/heads/claude/jarvis-mobile-automazioni-dashboard-b4xa7e

jobs:
  build:
    name: Core tests + Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: this job can build, test and upload workflow artifacts but can NOT
    # create or delete releases/tags. Publishing lives in the 'publish' job below.
    permissions:
      contents: read
    outputs:
      apk_impacting: ${{ steps.impact.outputs.apk_impacting }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the publish classifier can always diff
          # github.event.before..github.sha, including multi-commit pushes.
          fetch-depth: 0

      # Decides ONLY whether the 'latest-debug' release may be replaced.
      # All build/test/lint/upload steps run regardless. Docs-only pushes do
      # not republish (BUILD_ID embeds the commit sha, so every commit would
      # otherwise change the APK bytes and the release target).
      - name: Classify push (APK-impacting?)
        id: impact
        run: |
          bash .github/scripts/test-classify-apk-impact.sh
          bash .github/scripts/classify-apk-impact.sh \
            "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

      # Fails the run if the release-publishing protection was weakened (see script header).
      - name: Verify release-publish guard
        run: bash .github/scripts/test-ci-publish-guard.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ---- LV-R1: standalone WebRTC AEC3 (pinned pulseaudio/webrtc-audio-processing v2.1) ----
      # Source SHA-256 is verified before unpack (fail closed); arm64-v8a only; output goes to
      # native/aec3/out/jniLibs, which app/build.gradle.kts packages. See native/aec3/PROVENANCE.json.
      - name: Set up Python (meson/ninja for the AEC3 native build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AEC3 native library (arm64-v8a)
        run: |
          pip install meson==1.12.1 ninja==1.13.0
          bash native/aec3/build_android.sh "$RUNNER_TEMP/aec3" "$GITHUB_WORKSPACE/native/aec3/out/jniLibs"

      # ---- Domain core (pure Kotlin/JVM). Runs as a standalone build via -p. ----
      - name: Core unit tests
        run: ./gradlew --no-daemon -p core test

      # ---- Android app. assembleDebug also builds the composite :core. ----
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # STEP 2 — Room exports jarvis.db's schema during the build (exportSchema = true).
      # Fail if the export did not happen for the current version, and keep the JSON as an
      # artifact so it can be committed to app/schemas/ (MigrationTestHelper reads it).
      - name: Verify exported Room schema
        run: |
          CUR=$(grep -oE 'version = [0-9]+' app/src/main/java/com/simone/jarvismobile/background/JarvisDatabase.kt | head -1 | grep -oE '[0-9]+')
          F="app/schemas/com.simone.jarvismobile.background.JarvisDatabase/$CUR.json"
          test -s "$F" || { echo "Room schema $F was not exported" >&2; exit 1; }
          echo "exported: $F ($(wc -c < "$F") bytes)"
          # If a schema for this version is already committed, the build must not have changed it.
          git diff --exit-code -- "$F" || { echo "committed schema differs from the generated one: a schema change needs a new version + migration" >&2; exit 1; }

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error

      # § MICRO-PATCH E.1 §9/§14 — compiles (never runs; no emulator here)
      # the instrumented test APK, so a new androidTest file (e.g. the Room
      # migration/schema-validation regression test) is at least confirmed
      # to compile against the real Room-generated code on every push,
      # instead of silently never being checked by CI.
      - name: Compile instrumented tests (no emulator, compile-only)
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Android lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      # LV-R1 packaging proof: the AEC3 library is inside the APK, no ABI other than arm64-v8a,
      # and no libc++_shared was introduced by it (the .so links libc++ statically).
      - name: AEC3 APK packaging report
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -lv "$APK" | grep -E "lib/.*/libjarvis_aec3.so" || { echo "libjarvis_aec3.so missing from APK" >&2; exit 1; }
          ABIS=$(unzip -l "$APK" | awk '{print $4}' | grep -E '^lib/[^/]+/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "ABIs in APK: $ABIS"
          [ "$ABIS" = "arm64-v8a " ] || { echo "unexpected ABI set: $ABIS" >&2; exit 1; }
          ls -l "$APK"

      - name: Compute APK SHA-256
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          sha256sum "$APK" | tee "$APK.sha256"
          ls -l "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      # Reports are uploaded even when a previous step failed, to diagnose errors.
      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/**
            core/build/test-results/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14

  # Publishes the APK to the single, stable 'latest-debug' release so it can be downloaded
  # directly on a phone with no login:
  #   https://github.com/<owner>/<repo>/releases/download/latest-debug/app-debug.apk
  # ONLY runs for the canonical Android branch (PUBLISH_REF) in this repository, only after the
  # build job (all tests green) succeeded, and only for APK-impacting pushes or a manual run on
  # that same branch. No other ref can reach this job: verification branches never publish.
  publish:
    name: Publish latest-debug (canonical branch only)
    needs: build
    if: >-
      github.repository == 'umikasaiii/Jarvis-' &&
      github.ref == 'refs/heads/claude/jarvis-mobile-automazioni-dashboard-b4xa7e' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.build.outputs.apk_impacting == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download debug APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk

      - name: Publish APK to the 'latest-debug' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=apk/app-debug.apk
          test -f "$APK" && test -f "$APK.sha256"
          gh release delete latest-debug --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-debug "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" \
            --title "JARVIS Mobile — debug (latest)" \
            --notes "APK di debug piu recente. Commit ${{ github.sha }}. Firmato con app/debug.keystore (committato, stabile): si aggiorna in place, non serve disinstallare." \
            --target "${{ github.sha }}"

  # BETA 1/8 — read-only identity report of the APK THIS run built (provenance, SHA-256, application id,
  # signing certificate, permissions) plus an in-place-update compatibility check against the
  # currently published latest-debug APK. Reads the release (public download), never writes it.
  apk-report:
    name: APK identity & update-compatibility report (read-only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: apk
      - name: Report
        run: |
          {
            echo "# APK report"; echo "commit: ${{ github.sha }}"; echo "ref: ${{ github.ref }}"; echo "run: ${{ github.run_id }} (#${{ github.run_number }})"; echo
            echo "sha256 file from the build job: $(cat apk/app-debug.apk.sha256)"; echo
            bash .github/scripts/inspect-apk.sh apk/app-debug.apk
            echo; echo "committed debug keystore certificate:"
            keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null | sed -n 's/^\s*SHA256: /  SHA256: /p'
          } | tee apk-report.txt
          # the sha256 computed here must equal the one the build job wrote next to the APK
          test "$(sha256sum apk/app-debug.apk | cut -d' ' -f1)" = "$(cut -d' ' -f1 apk/app-debug.apk.sha256)"
      - name: In-place update compatibility vs the published latest-debug APK (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          if gh release download latest-debug --pattern app-debug.apk --dir published --repo "$GITHUB_REPOSITORY"; then
            { echo; bash .github/scripts/inspect-apk.sh --compare published/app-debug.apk apk/app-debug.apk; } 2>&1 | tee -a apk-report.txt
            exit "${PIPESTATUS[0]}"
          else
            echo "latest-debug APK not downloadable: compatibility not checked" | tee -a apk-report.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-report
          path: apk-report.txt
          if-no-files-found: warn

  # BETA 1/8 — a SECOND debug APK of the same commit with applicationId com.simone.jarvismobile.debug.beta
  # (own data, installable next to the real app). For tests that must never touch real personal data.
  # Artifact only; never published.
  isolated-apk:
    name: Isolated test APK (applicationId ...debug.beta)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build AEC3 native library (arm64-v8a)
        run: |
          pip install meson==1.12.1 ninja==1.13.0
          bash native/aec3/build_android.sh "$RUNNER_TEMP/aec3" "$GITHUB_WORKSPACE/native/aec3/out/jniLibs"
      - name: Assemble the isolated debug APK
        run: ./gradlew --no-daemon :app:assembleDebug -Pjarvis.isolatedSuffix=.beta
      - name: Report and stage
        run: |
          mkdir -p isolated
          cp app/build/outputs/apk/debug/app-debug.apk isolated/app-debug-isolated.apk
          (cd isolated && sha256sum app-debug-isolated.apk > app-debug-isolated.apk.sha256)
          { echo "commit: ${{ github.sha }}"; bash .github/scripts/inspect-apk.sh isolated/app-debug-isolated.apk; } | tee isolated/isolated-apk-report.txt
          grep -q '^package=com.simone.jarvismobile.debug.beta$' isolated/isolated-apk-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-isolated
          path: isolated/
          if-no-files-found: error

  # PASS 14B pre-execution compatibility gate. run_real_training.ps1 is the
  # sole Windows runner for the (still user-PC-only) real EmbeddingGemma
  # qualification/training pipeline; it previously corrupted the parser on
  # the target Windows PowerShell 5.1 environment because it was UTF-8
  # without BOM with non-ASCII punctuation, requiring a manual BOM-converted
  # temporary copy to run at all. That file is now kept pure ASCII, and this
  # job proves it stays that way and stays parseable under REAL Windows
  # PowerShell 5.1 (not pwsh 7) on every push - without downloading any
  # model/tokenizer artifact or installing any Python dependency.
  windows-ps51-compat:
    name: PASS 14B Windows PowerShell 5.1 compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert running under Windows PowerShell 5.1 (not pwsh 7)
        run: |
          $ver = $PSVersionTable.PSVersion
          $edition = $PSVersionTable.PSEdition
          Write-Host "PSVersion: $ver"
          Write-Host "PSEdition: $edition"
          if ($edition -ne "Desktop") {
            Write-Host "FAILED: expected PSEdition 'Desktop' (Windows PowerShell), got '$edition' - this gate must run under Windows PowerShell 5.1, not PowerShell 7/pwsh." -ForegroundColor Red
            exit 1
          }
          if ($ver.Major -ne 5) {
            Write-Host "FAILED: expected Windows PowerShell major version 5, got $($ver.Major)." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: running under Windows PowerShell $ver (PSEdition=$edition)"

      - name: ASCII-safety check on run_real_training.ps1
        run: |
          $path = "tools\semantic_classifier\run_real_training.ps1"
          if (-not (Test-Path $path)) {
            Write-Host "FAILED: $path not found." -ForegroundColor Red
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $nonAsciiCount = 0
          foreach ($b in $bytes) { if ($b -gt 127) { $nonAsciiCount++ } }
          Write-Host "File size: $($bytes.Length) bytes"
          Write-Host "Non-ASCII byte count: $nonAsciiCount"
          if ($nonAsciiCount -gt 0) {
            Write-Host "FAILED: non-ASCII bytes found in $path - this file must stay ASCII-safe so it parses on Windows PowerShell 5.1 without a manual BOM conversion." -ForegroundColor Red
            exit 1
          }
          Write-Host "OK: $path is pure ASCII"

      - name: Parse run_real_training.ps1 with the PowerShell language parser
        run: |
          $path = (Resolve-Path "tools\semantic_classifier\run_real_training.ps1").Path
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          Write-Host "Token count: $($tokens.Count)"
          Write-Host "Parser error count: $($parseErrors.Count)"
          if ($parseErrors.Count -gt 0) {
            foreach ($e in $parseErrors) {
              Write-Host "PARSE ERROR: $($e.Message) at line $($e.Extent.StartLineNumber), column $($e.Extent.StartColumnNumber)" -ForegroundColor Red
            }
            exit 1
          }
          Write-Host "OK: zero parser errors"
