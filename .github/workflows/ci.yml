name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# No AI models are ever downloaded in CI (docs/MODELS.md); models are never in the repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests + Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needed to publish the debug APK as a GitHub Release (mobile-friendly,
    # no-login download link).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---- Domain core (pure Kotlin/JVM). Runs as a standalone build via -p. ----
      - name: Core unit tests
        run: ./gradlew --no-daemon -p core test

      # ---- Android app. assembleDebug also builds the composite :core. ----
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Android lint (debug)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Compute APK SHA-256
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK not found at $APK"; exit 1; }
          sha256sum "$APK" | tee "$APK.sha256"
          ls -l "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      # Publish the APK to a single, stable 'latest-debug' release so it can be
      # downloaded directly on a phone with no login:
      #   https://github.com/<owner>/<repo>/releases/download/latest-debug/app-debug.apk
      - name: Publish APK to the 'latest-debug' release
        # Manual dispatches publish too: when the push event does not create a
        # run (GitHub Actions queue incidents), the dispatch is the only way to
        # get an installable APK, and a green build that publishes nothing is
        # indistinguishable from no build at all for whoever is testing.
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug "$APK" "$APK.sha256" \
            --title "JARVIS Mobile — debug (latest)" \
            --notes "APK di debug piu recente. Commit ${{ github.sha }}. Firmato con la debug.keystore committata nel repo (sempre la stessa): si aggiorna in-place sopra una versione precedente, senza bisogno di disinstallare." \
            --target "${{ github.sha }}"

      # Reports are uploaded even when a previous step failed, to diagnose errors.
      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/**
            core/build/test-results/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.*
          if-no-files-found: warn
          retention-days: 14
