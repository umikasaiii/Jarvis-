name: DB migration tests (emulator)

# STEP 2 — actually RUNS the jarvis.db migration tests (JarvisMigrationInstrumentedTest) on an
# Android emulator. The main CI only compiles instrumented tests; this is the workflow that
# executes them. Separate from CI so a flaky emulator never blocks the debug-APK publish.
on:
  workflow_dispatch: {}
  push:
    branches: [ "claude/**" ]
    paths:
      - 'app/src/main/java/com/simone/jarvismobile/background/**'
      - 'app/src/main/java/com/simone/jarvismobile/**/*Migrations.kt'
      - 'app/src/main/java/com/simone/jarvismobile/di/DatabaseModule.kt'
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/simone/jarvismobile/archive/**'
      - 'app/src/main/java/com/simone/jarvismobile/document/**'
      - 'app/src/main/java/com/simone/jarvismobile/offlinehub/**'
      - 'app/schemas/**'
      - '.github/workflows/db-migration-tests.yml'

# No job here may create, edit or delete releases/tags (see .github/scripts/ci_publish_guard.py).
permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Placeholder for the optional AEC3 jniLibs directory (not needed by these tests)
        run: mkdir -p native/aec3/out/jniLibs
      - name: Run jarvis.db migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pjarvis.emulatorAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.simone.jarvismobile.background.JarvisMigrationInstrumentedTest,com.simone.jarvismobile.archive.NotesStoreInstrumentedTest,com.simone.jarvismobile.document.DocumentPipelineInstrumentedTest,com.simone.jarvismobile.offlinehub.OfflineHubIntentInstrumentedTest,com.simone.jarvismobile.reliability.DailyReliabilityInstrumentedTest,com.simone.jarvismobile.reliability.CrossModuleInstrumentedTest,com.simone.jarvismobile.regex.ParserInitInstrumentedTest,com.simone.jarvismobile.regex.ConversationRoutingInstrumentedTest
      - name: Test results summary (failures with their messages)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = skip = 0
          for f in sorted(glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True)):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  tot += 1
                  bad = tc.find("failure"); err = tc.find("error"); sk = tc.find("skipped")
                  if sk is not None: skip += 1
                  if bad is not None or err is not None:
                      fail += 1
                      e = bad if bad is not None else err
                      print("FAILED:", tc.get("classname"), tc.get("name"))
                      print((e.get("message") or e.text or "")[:9000])
                  else:
                      print("passed:" if sk is None else "skipped:", tc.get("name"))
          print(f"SUMMARY tests={tot} failed={fail} skipped={skip}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
