name: AEC3 native reproducibility (LV-R1)
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "native/aec3/**", ".github/workflows/aec3-native.yml" ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Tools
        run: |
          pip install meson==1.12.1 ninja==1.13.0
          meson --version; ninja --version; echo "NDK=$ANDROID_NDK_HOME"; cat "$ANDROID_NDK_HOME/source.properties" || true
      - name: Build twice from scratch and require identical SHA-256
        run: bash native/aec3/verify_reproducible.sh "$RUNNER_TEMP/aec3"
      - name: Build result (provenance values)
        run: cat "$RUNNER_TEMP/aec3/BUILD_RESULT.json"
